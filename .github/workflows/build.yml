name: Build Mini Farm APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip game
        run: |
          unzip -o My_Mini_Farm_Mythical_Philippines_APK_Build.zip -d ./game
          ls -la ./game
          ls -la ./game/my_mini_farm || true
          ls -la ./game/My_Mini_Farm_Mythical_Philippines_APK_Build || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          npm install -g @capacitor/cli
          cd game
          # pasok sa loob kung nasaan yung index.html
          if [ -d "my_mini_farm" ]; then cd my_mini_farm; fi
          if [ -d "My_Mini_Farm_Mythical_Philippines_APK_Build" ]; then cd My_Mini_Farm_Mythical_Philippines_APK_Build; fi
          pwd
          ls -la
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap init "Mini Farm" com.bossing.minifarm --web-dir=.
          npx cap add android
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Farm-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
