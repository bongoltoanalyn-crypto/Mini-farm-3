name: Build Mini Farm APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip game
        run: |
          unzip -o My_Mini_Farm_Mythical_Philippines_APK_Build.zip -d ./game
          ls -la ./game/my_mini_farm/www/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd game/my_mini_farm
          cp index.html www/ 2>/dev/null || true
          echo '{"appId":"com.myminifarm.mythicalphilippines","appName":"My Mini Farm: Mythical Philippines","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          npm install
          rm -rf android
          npx cap add android
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Farm-APK
          path: game/my_mini_farm/android/app/build/outputs/apk/debug/*.apk
